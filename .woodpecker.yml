# .woodpecker.yml

steps:
  test:
    image: rust:1-bookworm
    commands:
      - cargo test
      - cargo clippy -- -D warnings

  deploy:
    image: docker:cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - docker compose up -d --build
      - docker image prune -f
    when:
      branch: main
